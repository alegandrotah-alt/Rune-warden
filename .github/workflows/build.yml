name: Build, test and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  checks:
    name: Checks (balance sims + browser test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the game from src/
        run: node tools/build.js

      - name: Balance simulation (seeded bot runs)
        run: node tools/sim.js --runs 8
      - name: Relic fuzzing (random relic piles, boss relics, potions)
        run: node tools/sim.js --runs 8 --fuzz

      - name: Install a headless browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser check (script errors, tutorial, frame times on a slowed CPU)
        run: node tools/browser-check.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-screens
          path: check-output/
          retention-days: 14

  build:
    name: Android APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor and Pillow
        run: |
          npm install
          pip install pillow

      - name: Build the game from src/
        run: node tools/build.js

      - name: Bundle fonts for offline play
        run: python3 tools/fetch_fonts.py

      - name: Load the signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing key loaded"
          fi

      - name: Check the signing key alias (falls back to the key that is actually in the keystore)
        if: ${{ env.KEYSTORE_FILE != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WANT: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ALIASES=$(keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep PrivateKeyEntry | cut -d, -f1 || true)
          if [ -z "$ALIASES" ] || echo "$ALIASES" | grep -qxF "$WANT"; then
            echo "KEY_ALIAS_USE=$WANT" >> "$GITHUB_ENV"
          else
            A=$(echo "$ALIASES" | head -1)
            echo "::add-mask::$A"
            echo "::warning::The ANDROID_KEY_ALIAS secret doesn't match the keystore, so the key that is in it was used."
            echo "KEY_ALIAS_USE=$A" >> "$GITHUB_ENV"
          fi

      - name: Generate and customise the Android project
        run: |
          npx cap add android
          npx cap sync android
          python3 tools/android_setup.py

      - name: Build APK (signed release if the signing secrets are set, otherwise debug)
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS_USE || secrets.ANDROID_KEY_ALIAS }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../RuneWarden-${{ github.run_number }}.apk
          else
            echo "::warning::No signing secrets set, building a debug APK. Updates may need an uninstall first."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../RuneWarden-${{ github.run_number }}.apk
          fi
          ls -la ../RuneWarden-*.apk

      - name: Publish to Releases (direct download link for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" RuneWarden-${{ github.run_number }}.apk \
            --title "Rune Warden build ${{ github.run_number }}" \
            --notes "Tap RuneWarden-${{ github.run_number }}.apk to download, then open it on your phone to install." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: rune-warden-apk
          path: RuneWarden-*.apk
          retention-days: 30

  web:
    name: Web version (GitHub Pages)
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the game from src/
        run: node tools/build.js

      - name: Bundle fonts for offline play
        run: python3 tools/fetch_fonts.py

      - name: Stamp the offline cache with this build
        run: sed -i "s/const CACHE = 'rune-warden-v1'/const CACHE = 'rune-warden-${{ github.run_number }}'/" www/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v4
